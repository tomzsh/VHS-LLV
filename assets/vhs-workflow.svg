<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">Vulnhunter Superworkflow lazy-load architecture</title>
  <desc id="desc">A P0 to P6 pentest workflow with conditional critical review, dig-deeper chain, pivot ladder, and kill-chain modules.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111c33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#42d392"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42d392"/>
    </marker>
  </defs>

  <rect width="1400" height="620" rx="28" fill="url(#bg)"/>
  <rect x="36" y="34" width="1328" height="552" rx="22" fill="none" stroke="#263754"/>

  <text x="70" y="82" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">Vulnhunter Superworkflow</text>
  <text x="70" y="116" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">P0–P6  ·  fail-closed  ·  evidence-driven  ·  lazy-load only what the phase needs</text>
  <rect x="1080" y="64" width="220" height="42" rx="21" fill="#123b3b" stroke="#42d392"/>
  <text x="1190" y="91" text-anchor="middle" fill="#8ff5cf" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">AUTHORIZED TESTING ONLY</text>

  <g filter="url(#shadow)">
    <rect x="62" y="158" width="156" height="136" rx="16" fill="#17243b" stroke="#334968"/>
    <rect x="252" y="158" width="156" height="136" rx="16" fill="#17243b" stroke="#334968"/>
    <rect x="442" y="158" width="156" height="136" rx="16" fill="#17243b" stroke="#334968"/>
    <rect x="632" y="158" width="156" height="136" rx="16" fill="#17243b" stroke="#334968"/>
    <rect x="822" y="158" width="156" height="136" rx="16" fill="#17243b" stroke="#334968"/>
    <rect x="1012" y="158" width="156" height="136" rx="16" fill="#17243b" stroke="#334968"/>
    <rect x="1202" y="158" width="136" height="136" rx="16" fill="#17243b" stroke="#334968"/>
  </g>

  <g fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round">
    <path d="M 218 226 H 244"/>
    <path d="M 408 226 H 434"/>
    <path d="M 598 226 H 624"/>
    <path d="M 788 226 H 814"/>
    <path d="M 978 226 H 1004"/>
    <path d="M 1168 226 H 1194"/>
  </g>
  <g fill="#64748b">
    <path d="M 244 220 L 252 226 L 244 232 Z"/>
    <path d="M 434 220 L 442 226 L 434 232 Z"/>
    <path d="M 624 220 L 632 226 L 624 232 Z"/>
    <path d="M 814 220 L 822 226 L 814 232 Z"/>
    <path d="M 1004 220 L 1012 226 L 1004 232 Z"/>
    <path d="M 1194 220 L 1202 226 L 1194 232 Z"/>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <g fill="#42d392" font-size="18" font-weight="800">
      <text x="84" y="194">P0</text><text x="274" y="194">P1</text><text x="464" y="194">P2</text>
      <text x="654" y="194">P3</text><text x="844" y="194">P4</text><text x="1034" y="194">P5</text><text x="1224" y="194">P6</text>
    </g>
    <g fill="#f8fafc" font-size="17" font-weight="700">
      <text x="84" y="230">Authorization</text>
      <text x="274" y="230">Model</text>
      <text x="464" y="230">Map</text>
      <text x="654" y="230">Design</text>
      <text x="844" y="230">Validate</text>
      <text x="1034" y="230">Triage</text>
      <text x="1224" y="230">Report</text>
    </g>
    <g fill="#94a3b8" font-size="13">
      <text x="84" y="260">scope + RoE</text>
      <text x="274" y="260">actors + trust</text>
      <text x="464" y="260">surfaces</text>
      <text x="654" y="260">tests + controls</text>
      <text x="844" y="260">evidence</text>
      <text x="1034" y="260">root cause</text>
      <text x="1224" y="260">disclose</text>
    </g>
  </g>

  <text x="70" y="350" fill="#8ff5cf" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="800" letter-spacing="1.4">CONDITIONAL MODULES — LOAD ONLY WHEN ACTIVE</text>

  <g filter="url(#shadow)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="50" y="376" width="300" height="148" rx="16" fill="#102c32" stroke="#2e8b78"/>
    <rect x="390" y="376" width="300" height="148" rx="16" fill="#172a40" stroke="#3a668f"/>
    <rect x="730" y="376" width="300" height="148" rx="16" fill="#2a2137" stroke="#80569b"/>
    <rect x="1070" y="376" width="280" height="148" rx="16" fill="#30251b" stroke="#9a6b35"/>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="72" y="414" fill="#8ff5cf" font-size="18" font-weight="800">Critical review</text>
    <text x="72" y="444" fill="#d1fae5" font-size="13">P3–P5 adversarial check</text>
    <text x="72" y="469" fill="#94a3b8" font-size="12">validated row · evidence · control</text>
    <text x="72" y="494" fill="#94a3b8" font-size="12">one bounded review per test</text>

    <text x="412" y="414" fill="#93c5fd" font-size="18" font-weight="800">Dig-deeper chain</text>
    <text x="412" y="444" fill="#dbeafe" font-size="13">P3–P4 follow-up investigation</text>
    <text x="412" y="469" fill="#94a3b8" font-size="12">linked hops · max 3 · no reset/cycle</text>
    <text x="412" y="494" fill="#94a3b8" font-size="12">stop when evidence stops adding value</text>

    <text x="752" y="414" fill="#d8b4fe" font-size="18" font-weight="800">Pivot ladder</text>
    <text x="752" y="444" fill="#f3e8ff" font-size="13">P4–P5 authorized asset path</text>
    <text x="752" y="469" fill="#94a3b8" font-size="12">allowlist · in-scope · target match</text>
    <text x="752" y="494" fill="#94a3b8" font-size="12">rollback required · max 3 hops</text>

    <text x="1092" y="414" fill="#f5c98a" font-size="18" font-weight="800">Kill-chain</text>
    <text x="1092" y="444" fill="#fef3c7" font-size="13">P5 composite finding analysis</text>
    <text x="1092" y="469" fill="#94a3b8" font-size="12">post-triage severity escalation</text>
    <text x="1092" y="494" fill="#94a3b8" font-size="12">separate from pivot testing</text>
  </g>

  <g fill="none" stroke="#42d392" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="8 8">
    <path d="M 710 304 V 338 H 200 V 368"/>
    <path d="M 710 304 V 338 H 540 V 368"/>
    <path d="M 900 304 V 338 H 880 V 368"/>
    <path d="M 1090 304 V 338 H 1210 V 368"/>
  </g>
  <g fill="#42d392">
    <path d="M 194 360 L 200 368 L 206 360 Z"/>
    <path d="M 534 360 L 540 368 L 546 360 Z"/>
    <path d="M 874 360 L 880 368 L 886 360 Z"/>
    <path d="M 1204 360 L 1210 368 L 1216 360 Z"/>
  </g>
  <text x="70" y="563" fill="#64748b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Per-engagement ledgers remain isolated on disk; no target facts enter global memory.</text>
</svg>
