<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Vulnhunter Superworkflow: Lazy Load Version</title>
  <desc id="desc">An editorial infographic showing the P0 to P6 assessment spine, the lazy-load router, four conditional modules, and per-engagement memory isolation.</desc>
  <style>
    .sans { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .ink { fill: #152238; }
    .muted { fill: #5d6b7b; }
    .kicker { fill: #587087; font-size: 13px; font-weight: 800; letter-spacing: 2px; }
    .title { fill: #152238; font-size: 36px; font-weight: 800; letter-spacing: 0; }
    .subtitle { fill: #5d6b7b; font-size: 17px; font-weight: 500; }
    .phase-no { font-size: 15px; font-weight: 800; letter-spacing: 1px; }
    .phase-name { font-size: 19px; font-weight: 800; }
    .phase-copy { font-size: 13px; font-weight: 600; }
    .module-title { font-size: 19px; font-weight: 800; }
    .module-kicker { font-size: 12px; font-weight: 800; letter-spacing: 1px; }
    .module-copy { font-size: 13px; font-weight: 600; }
    .small { font-size: 12px; font-weight: 600; }
  </style>

  <rect width="1600" height="900" fill="#f7f8fa"/>
  <rect x="54" y="48" width="1492" height="804" rx="18" fill="#ffffff" stroke="#dce3ea" stroke-width="2"/>

  <g class="sans">
    <text x="86" y="92" class="kicker">VHS–LLV / SECURITY ASSESSMENT OPERATING MODEL</text>
    <text x="86" y="142" class="title">Vulnhunter Superworkflow</text>
    <text x="86" y="176" class="subtitle">A fail-closed, evidence-driven path from authorization to disclosure.</text>
    <rect x="1206" y="91" width="286" height="40" rx="20" fill="#152238"/>
    <circle cx="1229" cy="111" r="5" fill="#8be0b1"/>
    <text x="1250" y="116" fill="#ffffff" font-size="12" font-weight="800" letter-spacing="0.8">AUTHORIZED TESTING ONLY</text>
    <line x1="86" y1="210" x2="1514" y2="210" stroke="#dce3ea" stroke-width="2"/>

    <text x="86" y="244" class="kicker">01 / CORE SPINE — EVERY ENGAGEMENT</text>

    <g stroke="#93a4b5" stroke-width="2.5" stroke-linecap="round" fill="none">
      <path d="M266 330 H279"/>
      <path d="M471 330 H484"/>
      <path d="M676 330 H689"/>
      <path d="M881 330 H894"/>
      <path d="M1086 330 H1099"/>
      <path d="M1291 330 H1304"/>
    </g>
    <g fill="#93a4b5">
      <path d="M279 324 L287 330 L279 336 Z"/>
      <path d="M484 324 L492 330 L484 336 Z"/>
      <path d="M689 324 L697 330 L689 336 Z"/>
      <path d="M894 324 L902 330 L894 336 Z"/>
      <path d="M1099 324 L1107 330 L1099 336 Z"/>
      <path d="M1304 324 L1312 330 L1304 336 Z"/>
    </g>

    <g stroke-width="2">
      <rect x="86" y="270" width="180" height="120" rx="12" fill="#152238" stroke="#152238"/>
      <rect x="291" y="270" width="180" height="120" rx="12" fill="#ffffff" stroke="#d5dee7"/>
      <rect x="496" y="270" width="180" height="120" rx="12" fill="#ffffff" stroke="#d5dee7"/>
      <rect x="701" y="270" width="180" height="120" rx="12" fill="#eef5fc" stroke="#bdd3e8"/>
      <rect x="906" y="270" width="180" height="120" rx="12" fill="#eaf7f0" stroke="#abd7bd"/>
      <rect x="1111" y="270" width="180" height="120" rx="12" fill="#fff7e8" stroke="#e8c987"/>
      <rect x="1316" y="270" width="180" height="120" rx="12" fill="#f1f3f6" stroke="#cdd5de"/>
    </g>

    <g>
      <text x="106" y="298" class="phase-no" fill="#8be0b1">P0</text>
      <text x="106" y="326" class="phase-name" fill="#ffffff">Authorization</text>
      <text x="106" y="351" class="phase-copy" fill="#c5d2df">scope + rules of engagement</text>
      <text x="106" y="371" class="phase-copy" fill="#c5d2df">stop if unclear</text>

      <text x="311" y="298" class="phase-no" fill="#4d8d68">P1</text>
      <text x="311" y="326" class="phase-name ink">Threat model</text>
      <text x="311" y="351" class="phase-copy muted">actors + trust boundaries</text>
      <text x="311" y="371" class="phase-copy muted">assumptions recorded</text>

      <text x="516" y="298" class="phase-no" fill="#4d8d68">P2</text>
      <text x="516" y="326" class="phase-name ink">Surface map</text>
      <text x="516" y="351" class="phase-copy muted">assets + entry points</text>
      <text x="516" y="371" class="phase-copy muted">scope rechecked</text>

      <text x="721" y="298" class="phase-no" fill="#3674a6">P3</text>
      <text x="721" y="326" class="phase-name ink">Test design</text>
      <text x="721" y="351" class="phase-copy muted">hypothesis + method</text>
      <text x="721" y="371" class="phase-copy muted">least-invasive first</text>

      <text x="926" y="298" class="phase-no" fill="#33875a">P4</text>
      <text x="926" y="326" class="phase-name ink">Validation</text>
      <text x="926" y="351" class="phase-copy muted">baseline + mutation</text>
      <text x="926" y="371" class="phase-copy muted">negative control</text>

      <text x="1131" y="298" class="phase-no" fill="#a36e18">P5</text>
      <text x="1131" y="326" class="phase-name ink">Triage</text>
      <text x="1131" y="351" class="phase-copy muted">root cause + severity</text>
      <text x="1131" y="371" class="phase-copy muted">retain / reject</text>

      <text x="1336" y="298" class="phase-no" fill="#647487">P6</text>
      <text x="1336" y="326" class="phase-name ink">Report</text>
      <text x="1336" y="351" class="phase-copy muted">redacted evidence</text>
      <text x="1336" y="371" class="phase-copy muted">disclose + retest</text>
    </g>

    <text x="86" y="460" class="kicker">02 / CONDITIONAL MODULES — LAZY-LOAD ONLY ACTIVE WORK</text>

    <rect x="86" y="495" width="1410" height="74" rx="12" fill="#152238" stroke="#152238"/>
    <text x="108" y="526" class="module-kicker" fill="#8be0b1">LAZY-LOAD ROUTER</text>
    <text x="325" y="529" font-size="19" font-weight="800" fill="#ffffff">phase + active ledger state</text>
    <text x="685" y="527" class="module-copy" fill="#c5d2df">loads only the reference needed for the current decision</text>
    <line x1="1195" y1="510" x2="1195" y2="554" stroke="#435671"/>
    <text x="1220" y="522" class="small" fill="#8be0b1">DEFAULT</text>
    <text x="1220" y="544" class="small" fill="#c5d2df">no active module</text>

    <g fill="none" stroke-width="2" stroke-dasharray="7 7" stroke-linecap="round">
      <path d="M251 569 V600" stroke="#4d8d68"/>
      <path d="M617 569 V600" stroke="#3674a6"/>
      <path d="M983 569 V600" stroke="#7652a3"/>
      <path d="M1340 569 V600" stroke="#a36e18"/>
    </g>
    <g>
      <path d="M245 600 L251 610 L257 600 Z" fill="#4d8d68"/>
      <path d="M611 600 L617 610 L623 600 Z" fill="#3674a6"/>
      <path d="M977 600 L983 610 L989 600 Z" fill="#7652a3"/>
      <path d="M1334 600 L1340 610 L1346 600 Z" fill="#a36e18"/>
    </g>

    <g stroke-width="2">
      <rect x="86" y="610" width="330" height="118" rx="12" fill="#eaf7f0" stroke="#abd7bd"/>
      <rect x="452" y="610" width="330" height="118" rx="12" fill="#eef5fc" stroke="#bdd3e8"/>
      <rect x="818" y="610" width="330" height="118" rx="12" fill="#f3effa" stroke="#cbbbe1"/>
      <rect x="1184" y="610" width="312" height="118" rx="12" fill="#fff7e8" stroke="#e8c987"/>
    </g>
    <g>
      <text x="108" y="648" class="module-title" fill="#215f3c">Critical review</text>
      <text x="108" y="672" class="module-kicker" fill="#4d8d68">P3–P5 · ONE BOUNDED ROW / TEST</text>
      <text x="108" y="700" class="small" fill="#4b6d5a">evidence · control · disconfirming test</text>

      <text x="474" y="648" class="module-title" fill="#275b88">Dig-deeper chain</text>
      <text x="474" y="672" class="module-kicker" fill="#3674a6">P3–P4 · CREDIBLE SIGNAL · MAX 3 HOPS</text>
      <text x="474" y="700" class="small" fill="#526d89">stop when evidence stops adding value</text>

      <text x="840" y="648" class="module-title" fill="#63458c">Pivot ladder</text>
      <text x="840" y="672" class="module-kicker" fill="#7652a3">P4–P5 · ALLOWLIST · MAX 3 HOPS</text>
      <text x="840" y="700" class="small" fill="#6d5a80">target match · rollback required</text>

      <text x="1206" y="648" class="module-title" fill="#835713">Kill-chain</text>
      <text x="1206" y="672" class="module-kicker" fill="#a36e18">P5 · COMPOSITE FINDING ONLY</text>
      <text x="1206" y="700" class="small" fill="#806b4c">analysis lane; no scope expansion</text>
    </g>

    <rect x="86" y="758" width="1410" height="68" rx="12" fill="#edf2f6" stroke="#d2dce5"/>
    <text x="108" y="786" class="module-kicker" fill="#587087">03 / MEMORY ISOLATION</text>
    <text x="108" y="808" class="small" fill="#36485b">Per-engagement ledgers stay local.</text>
    <text x="455" y="798" class="small" fill="#5d6b7b">No target facts enter global Hermes memory · tools are capabilities, never authorization · scanner output remains a hypothesis.</text>
    <text x="86" y="842" class="small" fill="#8392a2">The system stops on missing authorization, scope uncertainty, unsafe resume state, or evidence that fails validation.</text>
  </g>
</svg>
